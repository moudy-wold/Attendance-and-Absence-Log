openapi: 3.0.3
info:
  title: Attendance API
  version: 1.0.0
  description: نظام تسجيل حضور وانصراف الموظفين
paths:
  /api/admin/attendance/summary-export/:
    get:
      operationId: admin_attendance_summary_export_retrieve
      description: |-
        يصدّر تقرير إكسل يلخّص حضور كل الموظفين خلال شهر محدَّد: أيام دوام، أيام غياب، دقائق تأخير.
        يُطبَّق نفس فلتر/بحث قائمة الموظفين حتى يطابق الملف ما يراه الأدمن على الشاشة، وتُترجَم عناوينه
        حسب باراميتر lang (ar/en/tr) لتطابق لغة الواجهة وقت التصدير.
      parameters:
      - in: query
        name: lang
        schema:
          type: string
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/admin/employees/:
    get:
      operationId: admin_employees_list
      parameters:
      - in: query
        name: device_id
        schema:
          type: string
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: first_name
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_admin
        schema:
          type: boolean
      - in: query
        name: is_employee
        schema:
          type: boolean
      - in: query
        name: is_entry
        schema:
          type: boolean
      - in: query
        name: is_first_login
        schema:
          type: boolean
      - in: query
        name: is_regular
        schema:
          type: boolean
      - in: query
        name: last_name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: phone
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/admin/employees/{id}/:
    get:
      operationId: admin_employees_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAttendance'
          description: ''
  /api/admin/employees/{id}/export/:
    get:
      operationId: admin_employees_export_retrieve
      description: يصدّر تقرير إكسل شهري لموظف واحد محدَّد بمعرّفه.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/admin/entry-users/:
    get:
      operationId: admin_entry_users_list
      parameters:
      - in: query
        name: device_id
        schema:
          type: string
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: first_name
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_admin
        schema:
          type: boolean
      - in: query
        name: is_employee
        schema:
          type: boolean
      - in: query
        name: is_entry
        schema:
          type: boolean
      - in: query
        name: is_first_login
        schema:
          type: boolean
      - in: query
        name: is_regular
        schema:
          type: boolean
      - in: query
        name: last_name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: phone
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/admin/settings/:
    get:
      operationId: admin_settings_retrieve
      description: يدير الأدمن منها مدة صلاحية رمز QR — نفس المدة تُستخدم كفاصل التحديث
        التلقائي بالفرونت.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
          description: ''
    patch:
      operationId: admin_settings_partial_update
      description: يدير الأدمن منها مدة صلاحية رمز QR — نفس المدة تُستخدم كفاصل التحديث
        التلقائي بالفرونت.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSystemSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSystemSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSystemSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
          description: ''
  /api/admin/stats/overview/:
    get:
      operationId: admin_stats_overview_retrieve
      description: |-
        لوحة إحصائيات شاملة للأدمن خلال شهر محدَّد: ملخص عام، اتجاه الحضور اليومي، وأكثر الموظفين
        تأخيرًا وغيابًا. لا تُطبَّق عليها فلاتر — تغطي كل الموظفين دائمًا.
      parameters:
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsOverview'
          description: ''
  /api/attendance/my/:
    get:
      operationId: attendance_my_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
  /api/attendance/record/:
    post:
      operationId: attendance_record_create
      description: |-
        يحفظ الحضور/الانصراف فعليًا — يُستدعى بعد نجاح البصمة محليًا فقط.
        الإجراء (دخول/خروج) يُحدَّد تلقائيًا حسب وجود جلسة مفتوحة للموظف أم لا.
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /api/attendance/stats/:
    get:
      operationId: attendance_stats_retrieve
      description: إحصائيات الحضور الشخصية للموظف الحالي (وحده) خلال شهر محدَّد.
      parameters:
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeStats'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/users/{id}/:
    get:
      operationId: auth_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/qr/generate/:
    post:
      operationId: qr_generate_create
      description: يولّد رمز QR عامًا — لا يحمل نوع إجراء، يُحدَّد ذلك تلقائيًا وقت
        المسح حسب حالة كل موظف.
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRToken'
          description: ''
  /api/qr/validate/:
    post:
      operationId: qr_validate_create
      description: يتحقق من أن الرمز سارٍ، ويتوقّع الإجراء (دخول/خروج) حسب حالة الموظف
        الحالي — بدون أي أثر جانبي.
      tags:
      - qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateQRResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - check_in
      - check_out
      type: string
      description: |-
        * `check_in` - Check In
        * `check_out` - Check Out
    AdminStatsOverview:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        working_days:
          type: integer
        total_employees:
          type: integer
        regular_count:
          type: integer
        irregular_count:
          type: integer
        active_count:
          type: integer
        suspended_count:
          type: integer
        entry_account_count:
          type: integer
        attendance_rate:
          type: number
          format: double
        total_present_days:
          type: integer
        total_absent_days:
          type: integer
        total_late_minutes:
          type: integer
        daily_trend:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendanceCount'
        top_late:
          type: array
          items:
            $ref: '#/components/schemas/TopEmployeeStat'
        top_absent:
          type: array
          items:
            $ref: '#/components/schemas/TopEmployeeStat'
      required:
      - active_count
      - attendance_rate
      - daily_trend
      - entry_account_count
      - irregular_count
      - month
      - regular_count
      - suspended_count
      - top_absent
      - top_late
      - total_absent_days
      - total_employees
      - total_late_minutes
      - total_present_days
      - working_days
      - year
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
          nullable: true
      required:
      - check_in
      - id
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    CustomTokenObtainPair:
      type: object
      properties:
        device_id:
          type: string
          writeOnly: true
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    DailyAttendanceCount:
      type: object
      properties:
        date:
          type: string
          format: date
        present_count:
          type: integer
      required:
      - date
      - present_count
    DailyLateMinutes:
      type: object
      properties:
        date:
          type: string
          format: date
        late_minutes:
          type: integer
      required:
      - date
      - late_minutes
    EmployeeAttendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        is_admin:
          type: boolean
        is_entry:
          type: boolean
        is_employee:
          type: boolean
        is_regular:
          type: boolean
          description: True = دوام كامل، False = دوام جزئي
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        device_id:
          type: string
          nullable: true
          description: معرّف الجهاز المرتبط بالحساب — يُضبط تلقائيًا أول استخدام
          maxLength: 255
        is_first_login:
          type: boolean
          description: يصبح False بعد أول تغيير لكلمة المرور
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
          readOnly: true
        present_days:
          type: integer
          readOnly: true
        absent_days:
          type: integer
          readOnly: true
        late_minutes:
          type: integer
          readOnly: true
        early_leave_minutes:
          type: integer
          readOnly: true
      required:
      - absent_days
      - attendance
      - early_leave_minutes
      - id
      - late_minutes
      - present_days
      - username
    EmployeeStats:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        working_days:
          type: integer
        present_days:
          type: integer
        absent_days:
          type: integer
        late_minutes:
          type: integer
        on_time_rate:
          type: number
          format: double
        daily_late_minutes:
          type: array
          items:
            $ref: '#/components/schemas/DailyLateMinutes'
      required:
      - absent_days
      - daily_late_minutes
      - late_minutes
      - month
      - on_time_rate
      - present_days
      - working_days
      - year
    MessageResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PaginatedAttendanceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
