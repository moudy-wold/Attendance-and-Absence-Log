openapi: 3.0.3
info:
  title: Attendance API
  version: 1.0.0
  description: نظام تسجيل حضور وانصراف الموظفين
paths:
  /api/admin/attendance/export/:
    get:
      operationId: admin_attendance_export_retrieve
      parameters:
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/admin/employees/:
    get:
      operationId: admin_employees_list
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/admin/employees/{id}/:
    get:
      operationId: admin_employees_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAttendance'
          description: ''
  /api/attendance/my/:
    get:
      operationId: attendance_my_list
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
          description: ''
  /api/attendance/record/:
    post:
      operationId: attendance_record_create
      description: يحفظ الحضور/الانصراف فعليًا — يُستدعى بعد نجاح البصمة محليًا فقط.
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/users/{id}/:
    put:
      operationId: auth_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/qr/generate/:
    post:
      operationId: qr_generate_create
      tags:
      - qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQRToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateQRToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateQRToken'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRToken'
          description: ''
  /api/qr/validate/:
    post:
      operationId: qr_validate_create
      description: يتحقق فقط من أن الرمز موجود وسارٍ، بدون أي أثر جانبي — يُستدعى
        قبل طلب البصمة.
      tags:
      - qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRTokenInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateQRResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - check_in
      - check_out
      type: string
      description: |-
        * `check_in` - Check In
        * `check_out` - Check Out
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
          nullable: true
      required:
      - check_in
      - id
    CustomTokenObtainPair:
      type: object
      properties:
        device_id:
          type: string
          writeOnly: true
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    EmployeeAttendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 20
        is_admin:
          type: boolean
        is_entry:
          type: boolean
        is_employee:
          type: boolean
        is_regular:
          type: boolean
          description: True = دوام كامل، False = دوام جزئي
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        device_id:
          type: string
          nullable: true
          description: معرّف الجهاز المرتبط بالحساب — يُضبط تلقائيًا أول استخدام
          maxLength: 255
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
          readOnly: true
      required:
      - attendance
      - full_name
      - id
      - username
    GenerateQRToken:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
    PatchedUpdateUser:
      type: object
      properties:
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        is_admin:
          type: boolean
        is_entry:
          type: boolean
        is_employee:
          type: boolean
        is_regular:
          type: boolean
          description: True = دوام كامل، False = دوام جزئي
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        device_id:
          type: string
          nullable: true
          description: معرّف الجهاز المرتبط بالحساب — يُضبط تلقائيًا أول استخدام
          maxLength: 255
    QRToken:
      type: object
      properties:
        token:
          type: string
          maxLength: 64
        action:
          $ref: '#/components/schemas/ActionEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
      - action
      - created_at
      - expires_at
      - token
    QRTokenInput:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        is_admin:
          type: boolean
        is_entry:
          type: boolean
        is_employee:
          type: boolean
        is_regular:
          type: boolean
          description: True = دوام كامل، False = دوام جزئي
      required:
      - id
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UpdateUser:
      type: object
      properties:
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        is_admin:
          type: boolean
        is_entry:
          type: boolean
        is_employee:
          type: boolean
        is_regular:
          type: boolean
          description: True = دوام كامل، False = دوام جزئي
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        device_id:
          type: string
          nullable: true
          description: معرّف الجهاز المرتبط بالحساب — يُضبط تلقائيًا أول استخدام
          maxLength: 255
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 20
        is_admin:
          type: boolean
        is_entry:
          type: boolean
        is_employee:
          type: boolean
        is_regular:
          type: boolean
          description: True = دوام كامل، False = دوام جزئي
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        device_id:
          type: string
          nullable: true
          description: معرّف الجهاز المرتبط بالحساب — يُضبط تلقائيًا أول استخدام
          maxLength: 255
      required:
      - full_name
      - id
      - username
    ValidateQRResponse:
      type: object
      properties:
        valid:
          type: boolean
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - valid
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
